name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ glslang-tools spirv-tools \
            libvulkan-dev libegl1-mesa-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libgl1-mesa-dri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow pytest ruff
      - name: ruff
        run: ruff check src tests bench
      - name: pytest
        run: PYTHONPATH=src pytest -q
      - name: cmake
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -Wno-unused-parameter -Wno-missing-field-initializers -fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build 2>&1 | tee build.log
          if grep -E "WARNING:" build.log; then exit 1; fi
          find build/shaders -name '*.spv' -print0 | xargs -0 -r spirv-val
          if grep -q NTC_HAVE_DOT4 build/shaders/ntc_dot_config.glsl; then
            spirv-dis build/shaders/ntc_sample_i8.comp.spv | grep -q OpSDot
          else
            echo "glslang has no GL_EXT_integer_dot_product; int8 dot stays four multiplies"
          fi
          ctest --test-dir build --output-on-failure
      - name: shader hosts
        env:
          DISPLAY: ""
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ./build/ntc_vk tests/fixtures/tiny.ntc build/shaders
          ./build/ntc_gl tests/fixtures/tiny.ntc shaders

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: configure and compile
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target ntc ntc_decode test_ntc expcode_bytes ntc_gl
          ctest --test-dir build -C Release -R test_ntc --output-on-failure

  windows-clang:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: ntc_gl with clang++
        shell: pwsh
        run: |
          clang++ --version
          cmake -S . -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-clang --target ntc ntc_decode test_ntc expcode_bytes ntc_gl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
