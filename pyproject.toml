[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntc"
version = "1.0.0"
description = "Cross-vendor neural texture compression for PBR materials"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "torch", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]
bench = ["matplotlib"]

[project.scripts]
ntc-encode = "ntc.cli:encode_main"
ntc-decode = "ntc.cli:decode_main"
ntc-ablate = "ntc.cli:ablate_main"
ntc-bench = "ntc.cli:bench_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
